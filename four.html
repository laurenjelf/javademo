<!DOCTYPE html>

<html>

<head>

    <title>average calc</title>

 

</head>

<body>

    <script>

    let count = Number(prompt("How many numbers do you want to average?"));

 

let total = 0;

 

for (let i = 1; i <= count; i++) {

    let number = Number(prompt("Enter number " + i + ":"));

    total = total + number;

}

 

let mean = total / count;

 

alert("Total: " + total + "\nMean: " + mean);

 

</script>

</body>

 

</html>
